name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual click on "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build_output.log

    - name: Publish Build Summary
      if: always()
      run: |
        echo "## 📋 Gradle Build Log Summary" >> $GITHUB_STEP_SUMMARY
        if [ -f build_output.log ]; then
          echo "### 🔍 Compiler Errors & Warnings:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(e: |w: |error:|FAILURE:|BUILD FAILED)" build_output.log | head -n 40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### 📜 Last 100 lines:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PoolAimMaster-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
